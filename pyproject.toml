[project]
name = "easytravel-architecture-spike"
version = "0.0.0"
description = "EasyTravel architecture spikes; offline structured travel draft validation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7.4,<3",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
